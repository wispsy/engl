[project]
name = "engl"
version = "0.1.0a1"
description = "Structured English lexical and dependency records with explicit provenance."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
engl = "engl:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project.optional-dependencies]
cli = ["expose-interface==0.1.0"]

[project.urls]
Repository = "https://github.com/wispsy/engl"
Issues = "https://github.com/wispsy/engl/issues"
Project = "https://github.com/orgs/wispsy/projects/29"

[tool.uv.build-backend]
source-include = ["tests/**", "scripts/**", "IMPLEMENTATION_PLAN.md"]
